[project]
site_name = "Aktion"
site_description = "Aktion is a lightweight GitHub Actions runner scale-set manager for Docker hosts."
site_url = "https://zyf722.github.io/aktion/en/"
repo_url = "https://github.com/zyf722/aktion"
repo_name = "zyf722/aktion"
docs_dir = "docs/en"
site_dir = "site/en"
nav = [
  { "Home" = "index.md" },
  { "Quick start" = "getting-started.md" },
  { "Guides" = [
    { "Add repositories" = "guides/repositories.md" },
    { "Runner capacity" = "guides/capacity.md" },
    { "Runner environment" = "guides/runner-environment.md" },
    { "HTTP/HTTPS proxy" = "guides/proxy.md" },
  ] },
  { "Operate Aktion" = "operations.md" },
  { "How Aktion works" = "concepts/how-it-works.md" },
  { "Reference" = [
    { "Configuration" = "reference/configuration.md" },
    { "CLI" = "reference/cli.md" },
  ] },
  { "Troubleshooting" = "troubleshooting.md" },
]

[project.theme]
language = "en"
logo = "assets/aktion.svg"
features = [
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.sections",
  "navigation.path",
  "navigation.top",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "deep purple"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "deep purple"
toggle.icon = "lucide/moon-star"
toggle.name = "Switch to system preference"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.extra]
alternate = [
  { name = "简体中文", link = "/aktion/", lang = "zh" },
  { name = "English", link = "/aktion/en/", lang = "en" },
]

[project.markdown_extensions]
admonition = {}
attr_list = {}
tables = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.tabbed.alternate_style = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
