name: Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Emergency hosted build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.3'
          cache: true

      - name: Resolve modules
        run: go mod tidy

      - name: Actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build recovery artifacts
        shell: bash
        env:
          AKTION_VERSION: bootstrap-${{ github.sha }}
        run: bash ./scripts/build-artifacts.sh dist

      - name: Upload recovery binaries
        uses: actions/upload-artifact@v4
        with:
          name: aktion-bootstrap-${{ github.sha }}
          path: dist/*
          retention-days: 7
