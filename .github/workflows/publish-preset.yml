name: Publish Aktion preset

on:
  workflow_dispatch:
    inputs:
      preset:
        description: Preset source name
        required: true
        default: recommended
        type: choice
        options:
          - recommended
      tag:
        description: OCI tag
        required: true
        default: '1'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ inputs.preset }}:${{ inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oras-project/setup-oras@v2
        with:
          version: 1.3.3

      - name: Log in to GHCR
        shell: bash
        run: echo "${{ github.token }}" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Publish preset OCI artifact
        shell: bash
        env:
          PRESET: ${{ inputs.preset }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          target="ghcr.io/${GITHUB_REPOSITORY_OWNER}/aktion/${PRESET}:${TAG}"
          oras push \
            --artifact-type application/vnd.aktion.preset.v1 \
            "$target" \
            "presets/${PRESET}.yml:application/vnd.aktion.preset.v1+yaml"
          oras manifest fetch "$target" --pretty
          echo "Published $target"
