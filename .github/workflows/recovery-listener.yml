name: Listener recovery

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/recovery-listener.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build fixed listener
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.3'
          cache: true

      - name: Resolve modules
        run: |
          rm -f go.sum
          go mod tidy

      - name: Commit canonical go.sum
        shell: bash
        run: |
          if git diff --quiet -- go.sum && git ls-files --error-unmatch go.sum >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.sum
          git commit -m "Regenerate go.sum"
          git push

      - name: Test listener
        run: go test ./cmd/aktion-listener

      - name: Build listener binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath \
              -o "dist/aktion-listener-linux-${arch}" ./cmd/aktion-listener
          done
          cp go.sum dist/go.sum
          (cd dist && sha256sum aktion-listener-linux-* > SHA256SUMS)

      - name: Upload listener recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: aktion-listener-recovery-${{ github.sha }}
          path: dist/*
          retention-days: 7
