name: Listener recovery

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/recovery-listener.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build fixed listener
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.3'
          cache: true

      - name: Resolve modules
        run: go mod tidy

      - name: Test listener
        run: go test ./cmd/aktion-listener

      - name: Build listener binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath \
              -o "dist/aktion-listener-linux-${arch}" ./cmd/aktion-listener
          done
          cp go.sum dist/go.sum
          (cd dist && sha256sum aktion-listener-linux-* > SHA256SUMS)

      - name: Upload listener recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: aktion-listener-recovery-${{ github.sha }}
          path: dist/*
          retention-days: 7
