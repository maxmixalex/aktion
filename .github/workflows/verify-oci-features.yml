name: OCI feature verification

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-oci-features.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.3'
          cache: true
      - name: Verify modules
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

      - name: Resolve and build official OCI Features
        env:
          AKTION_TEST_OCI: '1'
          AKTION_TEST_DOCKER: '1'
        run: go test ./internal/runnerfeatures -run TestOfficialOCIDefaults -v -count=1
