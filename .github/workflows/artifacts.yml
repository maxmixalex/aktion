name: Build artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Cross-platform binaries
    runs-on: home-docker
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.3'
          cache: true

      - name: Resolve modules
        run: go mod tidy

      - name: Actionlint
        shell: bash
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build release artifacts
        shell: bash
        env:
          AKTION_VERSION: ${{ github.ref_name }}
        run: bash ./scripts/build-artifacts.sh dist

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: aktion-${{ github.ref_name }}
          path: dist/*
