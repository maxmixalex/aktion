name: Scale-set recovery

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/recovery-scaleset.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build reconciler listener
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.3'
          cache: true

      - name: Resolve modules
        run: go mod tidy

      - name: Commit canonical module files
        shell: bash
        run: |
          if git diff --quiet -- go.mod go.sum; then
            echo "go.mod and go.sum are already canonical"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add go.mod go.sum
            git commit -m "Tidy Go modules"
            git push
          fi

      - name: Test listener
        run: go test ./cmd/aktion-listener

      - name: Build listener binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath \
              -o "dist/aktion-listener-linux-${arch}" ./cmd/aktion-listener
          done
          (cd dist && sha256sum aktion-listener-linux-* > SHA256SUMS)

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: aktion-scaleset-recovery-${{ github.sha }}
          path: dist/*
          retention-days: 7
