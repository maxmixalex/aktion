name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test / lint / build
    runs-on: home-docker
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.3'
          cache: true

      - name: Resolve modules
        run: go mod tidy

      - name: Actionlint
        shell: bash
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build manager
        run: go build -o dist/aktion ./cmd/aktion

      - name: Build listener
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -o dist/aktion-listener-linux-amd64 ./cmd/aktion-listener
