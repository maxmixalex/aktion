name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test / lint / build
    runs-on: home-docker
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.3'
          cache: true

      - name: Resolve modules
        run: go mod tidy

      - name: Verify modules are tidy
        run: git diff --exit-code -- go.mod go.sum

      - name: Actionlint
        shell: bash
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

      - name: Test
        run: go test ./...

      - name: Test listener startup
        run: sh ./packaging/start-listener_test.sh

      - name: Vet
        run: go vet ./...

      - name: Cross-build manager and listener
        shell: bash
        env:
          AKTION_VERSION: ci-${{ github.sha }}
        run: bash ./scripts/build-artifacts.sh dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aktion-ci-${{ github.sha }}
          path: dist/*
          retention-days: 7
