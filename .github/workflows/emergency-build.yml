name: Emergency build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: GitHub-hosted recovery build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.3'
          cache: true

      - name: Resolve modules
        run: go mod tidy

      - name: Actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build recovery artifacts
        shell: bash
        env:
          AKTION_VERSION: emergency-${{ github.sha }}
        run: bash ./scripts/build-artifacts.sh dist

      - name: Upload recovery binaries
        uses: actions/upload-artifact@v7
        with:
          name: aktion-emergency-${{ github.sha }}
          path: dist/*
          retention-days: 7
