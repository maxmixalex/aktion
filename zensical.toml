[project]
site_name = "Aktion"
site_description = "无需 Kubernetes 的自托管 GitHub Actions runner"
site_url = "https://zyf722.github.io/aktion/"
docs_dir = "docs/zh"
site_dir = "site"
nav = [
  { "首页" = "index.md" },
  { "快速开始" = "getting-started.md" },
  { "使用指南" = [
    { "添加和管理仓库" = "guides/repositories.md" },
    { "配置 runner 数量和并发" = "guides/capacity.md" },
    { "配置 runner 环境" = "guides/runner-environment.md" },
    { "配置 HTTP/HTTPS 代理" = "guides/proxy.md" },
  ] },
  { "运行和维护" = "operations.md" },
  { "工作方式" = "concepts/how-it-works.md" },
  { "参考" = [
    { "配置参考" = "reference/configuration.md" },
    { "CLI 参考" = "reference/cli.md" },
  ] },
  { "故障排查" = "troubleshooting.md" },
]

[project.theme]
language = "zh"
features = [
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.sections",
  "navigation.path",
  "navigation.top",
  "content.code.copy",
]

[project.extra]
alternate = [
  { name = "简体中文", link = "/aktion/", lang = "zh" },
  { name = "English", link = "/aktion/en/", lang = "en" },
]

[project.markdown_extensions]
admonition = {}
tables = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.tabbed.alternate_style = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
